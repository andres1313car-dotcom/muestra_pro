<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Soda Chelada — POS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --neon:#00FF7F;--neon2:#00cc66;--neon-bg:rgba(0,255,127,0.08);
  --dark:#080c0a;--dark2:#0e1410;--dark3:#141a16;--dark4:#1c2420;
  --border:rgba(0,255,127,0.14);--border2:rgba(0,255,127,0.28);
  --text:#e8f0eb;--muted:#7a9080;--danger:#ff4444;--warn:#ffaa00;
  --info:#38bdf8;--success:#00FF7F;
  --font-d:'Bebas Neue',sans-serif;--font-b:'Space Grotesk',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--dark);color:var(--text);font-family:var(--font-b);font-size:14px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--dark2)}
::-webkit-scrollbar-thumb{background:var(--neon2);border-radius:2px}
button{font-family:var(--font-b);cursor:pointer}
input,select,textarea{font-family:var(--font-b);background:var(--dark4);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:8px 10px;font-size:13px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--neon)}
select option{background:var(--dark3)}

/* ROLE SELECTOR */
#roleScreen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;z-index:9999}
.role-logo{font-family:var(--font-d);font-size:52px;letter-spacing:4px;color:var(--neon)}
.role-logo span{color:var(--text)}
.role-subtitle{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.role-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.role-btn{padding:18px 36px;border:1px solid var(--border2);background:var(--dark3);color:var(--text);border-radius:4px;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:140px}
.role-btn:hover{background:var(--neon);color:var(--dark);border-color:var(--neon)}
.role-btn .role-icon{font-size:28px}

/* APP SHELL */
#app{display:none;flex-direction:column;height:100vh}
#app.active{display:flex}
.topbar{height:52px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0}
.topbar-logo{font-family:var(--font-d);font-size:22px;letter-spacing:3px;color:var(--neon)}
.topbar-role{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:var(--dark4);padding:4px 10px;border-radius:2px;border:1px solid var(--border)}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:3px;font-size:12px;transition:all .2s}
.btn-icon:hover{border-color:var(--neon);color:var(--neon)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--dark2);flex-shrink:0}
.tab{padding:10px 16px;background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--neon)}
.tab.active{color:var(--neon);border-bottom-color:var(--neon)}
.tab-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:5px}

/* VIEWS */
.view{display:none;flex:1;overflow:hidden}
.view.active{display:flex}

/* ===== MESERO ===== */
#viewMesero{flex-direction:column}
.mesero-top{padding:10px 14px;background:var(--dark3);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.mesa-selector{display:flex;gap:6px;flex-wrap:wrap}
.mesa-btn{padding:6px 14px;border:1px solid var(--border);background:var(--dark4);color:var(--muted);border-radius:3px;font-size:12px;font-weight:600;transition:all .2s}
.mesa-btn:hover{border-color:var(--neon);color:var(--neon)}
.mesa-btn.selected{background:var(--neon);color:var(--dark);border-color:var(--neon)}
.mesa-btn.has-order{border-color:var(--warn);color:var(--warn)}
.mesa-btn.selected.has-order{background:var(--warn);color:var(--dark);border-color:var(--warn)}
.mesero-body{display:flex;flex:1;overflow:hidden}
.menu-panel{flex:1;overflow-y:auto;padding:12px}
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-f{padding:5px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:2px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.cat-f:hover,.cat-f.active{background:var(--neon);color:var(--dark);border-color:var(--neon)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu-item{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:12px;cursor:pointer;transition:all .2s;text-align:center}
.menu-item:hover{border-color:var(--neon);transform:translateY(-2px)}
.menu-item:active{transform:scale(0.97)}
.mi-emoji{font-size:32px;margin-bottom:6px}
.mi-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3}
.mi-price{font-family:var(--font-d);font-size:16px;color:var(--neon)}
.mi-cat{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.menu-item.hidden{display:none}
.order-panel{width:280px;background:var(--dark2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.order-panel h3{padding:12px 14px;font-family:var(--font-d);font-size:20px;letter-spacing:1px;border-bottom:1px solid var(--border);color:var(--text)}
.order-items{flex:1;overflow-y:auto;padding:8px}
.order-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--dark3);border-radius:3px;margin-bottom:6px;border:1px solid var(--border)}
.oi-name{flex:1;font-size:12px;font-weight:500}
.oi-qty{display:flex;align-items:center;gap:4px}
.qty-btn{width:22px;height:22px;border:1px solid var(--border);background:var(--dark4);color:var(--text);border-radius:2px;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;transition:all .2s}
.qty-btn:hover{border-color:var(--neon);color:var(--neon)}
.oi-num{font-size:13px;font-weight:600;min-width:16px;text-align:center}
.oi-price{font-size:12px;color:var(--neon);font-weight:600;min-width:60px;text-align:right}
.oi-del{background:transparent;border:none;color:var(--muted);font-size:16px;padding:0 2px;transition:color .2s}
.oi-del:hover{color:var(--danger)}
.order-footer{padding:12px;border-top:1px solid var(--border)}
.order-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-total span{font-size:13px;color:var(--muted)}
.order-total strong{font-family:var(--font-d);font-size:24px;color:var(--neon)}
.order-note{margin-bottom:8px}
.order-note textarea{resize:none;height:48px;font-size:12px}
.btn-send{width:100%;padding:12px;background:var(--neon);color:var(--dark);border:none;border-radius:3px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .2s}
.btn-send:hover{background:#33ff99}
.btn-send:disabled{background:var(--muted);cursor:not-allowed}
.order-empty{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:12px}

/* ===== BARMAN ===== */
#viewBarman{flex-direction:column;overflow:hidden}
.barman-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.barman-header h3{font-family:var(--font-d);font-size:22px;letter-spacing:1px}
.barman-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.barman-ticket{background:var(--dark3);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:border-color .2s}
.barman-ticket.nuevo{border-color:var(--neon);animation:pulse 1s 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(0,255,127,0);}50%{box-shadow:0 0 12px rgba(0,255,127,0.4);}}
.ticket-head{padding:10px 14px;background:var(--dark4);display:flex;align-items:center;justify-content:space-between}
.ticket-mesa{font-family:var(--font-d);font-size:20px;color:var(--neon);letter-spacing:1px}
.ticket-time{font-size:11px;color:var(--muted)}
.ticket-status{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:2px;font-weight:700}
.ticket-status.pendiente{background:rgba(255,170,0,0.15);color:var(--warn);border:1px solid rgba(255,170,0,0.3)}
.ticket-status.listo{background:rgba(0,255,127,0.12);color:var(--neon);border:1px solid var(--border2)}
.ticket-items{padding:10px 14px}
.ticket-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
.ticket-row:last-child{border-bottom:none}
.ticket-row .qty{font-family:var(--font-d);font-size:18px;color:var(--neon);margin-right:8px}
.ticket-note{padding:6px 14px 10px;font-size:12px;color:var(--muted);font-style:italic}
.ticket-actions{padding:8px 14px;display:flex;gap:8px;border-top:1px solid var(--border)}
.btn-listo{flex:1;padding:9px;background:var(--neon);color:var(--dark);border:none;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .2s}
.btn-listo:hover{background:#33ff99}
.btn-ya-listo{flex:1;padding:9px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:3px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:default}
.barman-empty{text-align:center;padding:4rem 2rem;color:var(--muted)}

/* ===== MESAS / CAJA ===== */
#viewMesas{flex-direction:column;overflow:hidden}
.mesas-body{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-content:start}
.mesa-card{background:var(--dark3);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:border-color .2s}
.mesa-card:hover{border-color:var(--neon2)}
.mc-head{padding:10px 14px;background:var(--dark4);display:flex;align-items:center;justify-content:space-between}
.mc-title{font-family:var(--font-d);font-size:22px;color:var(--text);letter-spacing:1px}
.mc-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:2px;font-weight:700}
.mc-badge.abierta{background:rgba(255,170,0,0.15);color:var(--warn);border:1px solid rgba(255,170,0,0.3)}
.mc-badge.lista{background:rgba(0,255,127,0.12);color:var(--neon);border:1px solid var(--border2)}
.mc-items{padding:10px 14px;max-height:160px;overflow-y:auto}
.mc-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.mc-item:last-child{border-bottom:none}
.mc-item .qn{color:var(--neon);font-weight:600}
.mc-item .pr{color:var(--muted)}
.mc-total{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
.mc-total span{font-size:12px;color:var(--muted)}
.mc-total strong{font-family:var(--font-d);font-size:22px;color:var(--neon)}
.mc-actions{padding:8px 14px;display:flex;gap:6px;border-top:1px solid var(--border)}
.btn-add-more{flex:1;padding:8px;background:transparent;color:var(--info);border:1px solid rgba(56,189,248,0.3);border-radius:3px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s}
.btn-add-more:hover{background:rgba(56,189,248,0.08);border-color:var(--info)}
.btn-cobrar{flex:1;padding:8px;background:var(--neon);color:var(--dark);border:none;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s}
.btn-cobrar:hover{background:#33ff99}

/* ===== HISTORIAL ===== */
#viewHistorial{flex-direction:column;overflow:hidden}
.hist-body{flex:1;overflow-y:auto;padding:12px}
.hist-item{background:var(--dark3);border:1px solid var(--border);border-radius:4px;margin-bottom:8px;overflow:hidden}
.hi-head{padding:9px 14px;background:var(--dark4);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.hi-mesa{font-family:var(--font-d);font-size:18px;color:var(--text)}
.hi-time{font-size:11px;color:var(--muted)}
.hi-pago{font-size:11px;padding:3px 8px;border-radius:2px;font-weight:600}
.hi-pago.efectivo{background:rgba(0,255,127,0.1);color:var(--neon)}
.hi-pago.transferencia{background:rgba(56,189,248,0.1);color:var(--info)}
.hi-pago.mixto{background:rgba(255,170,0,0.1);color:var(--warn)}
.hi-items{padding:8px 14px;font-size:12px;color:var(--muted)}
.hi-total{padding:6px 14px;font-family:var(--font-d);font-size:20px;color:var(--neon);text-align:right;border-top:1px solid var(--border)}
.hist-empty{text-align:center;padding:4rem;color:var(--muted)}
.hist-filter{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}

/* ===== REPORTE ===== */
#viewReporte{flex-direction:column;overflow:hidden}
.rep-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.rep-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rep-card{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:12px;text-align:center}
.rep-card .rc-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rep-card .rc-val{font-family:var(--font-d);font-size:30px;color:var(--neon)}
.rep-card .rc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.rep-section h4{font-family:var(--font-d);font-size:18px;color:var(--text);margin-bottom:8px;letter-spacing:1px}
.rep-table{width:100%;border-collapse:collapse;font-size:12px}
.rep-table th{text-align:left;padding:6px 10px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.rep-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.04)}
.rep-table tr:last-child td{border-bottom:none}
.rep-table .val{color:var(--neon);font-weight:600}
.btn-cierre{padding:12px 24px;background:var(--danger);color:#fff;border:none;border-radius:3px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .2s}
.btn-cierre:hover{background:#cc3333}
.btn-export{padding:12px 24px;background:transparent;color:var(--neon);border:1px solid var(--neon);border-radius:3px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:all .2s}
.btn-export:hover{background:var(--neon-bg)}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== INVENTARIO ===== */
#viewInventario{flex-direction:column;overflow:hidden}
.inv-body{flex:1;overflow-y:auto;padding:12px}
.inv-table-wrap{background:var(--dark3);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.inv-table{width:100%;border-collapse:collapse}
.inv-table th{padding:10px 12px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:var(--dark4);text-align:left}
.inv-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px}
.inv-table tr:last-child td{border-bottom:none}
.inv-table tr:hover td{background:rgba(0,255,127,0.03)}
.stock-low{color:var(--warn)}
.stock-ok{color:var(--neon)}
.stock-out{color:var(--danger)}
.inv-input{width:70px;padding:5px 7px;font-size:12px;text-align:center}
.btn-inv-save{padding:5px 12px;background:var(--neon);color:var(--dark);border:none;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:1px}
.btn-inv-save:hover{background:#33ff99}
.inv-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px;flex-wrap:wrap}
.btn-add-inv{padding:8px 16px;background:transparent;color:var(--neon);border:1px solid var(--neon);border-radius:3px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s}
.btn-add-inv:hover{background:var(--neon-bg)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--dark2);border:1px solid var(--border2);border-radius:6px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal h3{font-family:var(--font-d);font-size:24px;color:var(--text);margin-bottom:16px;letter-spacing:1px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn-confirm{flex:1;padding:11px;background:var(--neon);color:var(--dark);border:none;border-radius:3px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s}
.btn-confirm:hover{background:#33ff99}
.btn-cancel{flex:1;padding:11px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:3px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.btn-cancel:hover{border-color:var(--danger);color:var(--danger)}
.pago-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.pago-opt{padding:10px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:3px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:all .2s;text-align:center}
.pago-opt:hover,.pago-opt.selected{background:var(--neon);color:var(--dark);border-color:var(--neon)}
.pago-mixto-fields{display:none;gap:8px}
.pago-mixto-fields.show{display:flex}
.mixto-field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--dark3);border:1px solid var(--neon);color:var(--text);padding:10px 20px;border-radius:3px;font-size:13px;z-index:2000;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* PING INDICATOR */
.ping{width:8px;height:8px;border-radius:50%;background:var(--neon);animation:pingAnim 1.5s infinite}
@keyframes pingAnim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

@media(max-width:640px){
  .order-panel{width:240px}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .mesas-body{grid-template-columns:1fr}
  .tabs{overflow-x:auto}
  .tab{font-size:10px;padding:10px 10px}
}
@media(max-width:480px){
  .mesero-body{flex-direction:column}
  .order-panel{width:100%;border-left:none;border-top:1px solid var(--border);max-height:260px}
  .menu-panel{flex:none;overflow-y:auto;max-height:calc(100vh - 300px)}
}
</style>
</head>
<body>

<!-- ROLE SELECTOR -->
<div id="roleScreen">
  <div>
    <div class="role-logo">LA <span>CANTINA</span></div>
    <div class="role-subtitle" style="text-align:center;margin-top:6px">Sistema de pedidos</div>
  </div>
  <div class="role-btns">
    <button class="role-btn" onclick="setRole('mesero')">
      <span class="role-icon">🧑‍💼</span>Mesero
    </button>
    <button class="role-btn" onclick="setRole('barman')">
      <span class="role-icon">🍹</span>Barman
    </button>
    <button class="role-btn" onclick="setRole('admin')">
      <span class="role-icon">📊</span>Admin / Caja
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <span class="topbar-logo">CANTINA</span>
    <div class="topbar-right">
      <div class="ping" id="syncPing" title="Sincronizando..."></div>

  <!-- MESERO VIEW -->
  <div class="view" id="viewMesero">
    <div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="mesero-top">
        <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)">Mesa:</span>

          <div class="order-items" id="orderItems">

            <div class="order-total">

    <div class="barman-body" id="barmanBody">
      <div class="barman-empty">No hay pedidos pendientes 🍹</div>
    </div>

  <!-- MESAS VIEW (admin) -->
  <div class="view" id="viewMesas">
    <div class="mesas-body" id="mesasBody"></div>
  </div>

  <!-- HISTORIAL VIEW -->
  <div class="view" id="viewHistorial">
    <div class="hist-filter">
      <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);align-self:center">Filtrar:</span>
      <button class="cat-f active" onclick="filterHist('todo',this)">Todo</button>
      <button class="cat-f" onclick="filterHist('efectivo',this)">Efectivo</button>
      <button class="cat-f" onclick="filterHist('transferencia',this)">Transferencia</button>
      <button class="cat-f" onclick="filterHist('mixto',this)">Mixto</button>
    </div>
    <div class="hist-body" id="histBody"></div>
  </div>

  <!-- REPORTE VIEW -->
  <div class="view" id="viewReporte">
    <div class="rep-body" id="repBody"></div>
  </div>

  <!-- INVENTARIO VIEW -->
  <div class="view" id="viewInventario">
    <div class="inv-header">
      <span style="font-family:var(--font-d);font-size:20px;letter-spacing:1px">Inventario</span>
      <button class="btn-add-inv" onclick="openAddInv()">+ Agregar Ítem</button>
    </div>
    <div class="inv-body" id="invBody"></div>
  </div>
</div>

  <div class="modal">
    <h3 id="cobroTitle">Cobrar Mesa</h3>
    <div class="modal-field">

        <button class="pago-opt" onclick="selectPago('efectivo',this)">💵 Efectivo</button>
        <button class="pago-opt" onclick="selectPago('transferencia',this)">📲 Transferencia</button>
        <button class="pago-opt" onclick="selectPago('mixto',this)">🔀 Mixto</button>

      <div class="mixto-field" style="flex:1">
        <label>Efectivo</label>
        <input type="number" id="mixtoEfectivo" placeholder="0" oninput="updateMixtoRest()">
      </div>
      <div class="mixto-field" style="flex:1">
        <label>Transferencia</label>
        <input type="number" id="mixtoTransferencia" placeholder="0" readonly style="background:var(--dark3)">

</div>

<!-- AGREGAR AL PEDIDO MODAL -->
<div class="modal-overlay" id="addMoreModal">
  <div class="modal">
    <h3 id="addMoreTitle">Agregar a Mesa</h3>
    <div style="margin-bottom:10px">
      <div class="cat-filter" id="addMoreCatFilter"></div>
    </div>
    <div class="menu-grid" id="addMoreGrid" style="max-height:300px;overflow-y:auto"></div>
    <div id="addMoreCart" style="margin-top:12px;display:flex;flex-direction:column;gap:6px"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('addMoreModal')">Cancelar</button>
      <button class="btn-confirm" onclick="confirmAddMore()">Agregar al Pedido</button>
    </div>
  </div>
</div>

<!-- ADD INVENTARIO MODAL -->
<div class="modal-overlay" id="addInvModal">
  <div class="modal">
    <h3>Nuevo Ítem Inventario</h3>
    <div class="modal-field"><label>Nombre</label><input type="text" id="invNewName" placeholder="Ej: Ron Blanco 750ml"></div>
    <div class="modal-field"><label>Categoría</label>
      <select id="invNewCat">
        <option value="Licores">Licores</option>

        <option value="Insumos">Insumos</option>
        <option value="Otros">Otros</option>
      </select>
    </div>
    <div class="modal-field"><label>Stock Actual</label><input type="number" id="invNewStock" placeholder="0" min="0"></div>
    <div class="modal-field"><label>Stock Mínimo (alerta)</label><input type="number" id="invNewMin" placeholder="5" min="0"></div>
    <div class="modal-field"><label>Unidad</label><input type="text" id="invNewUnit" placeholder="Ej: botellas, unidades, kg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('addInvModal')">Cancelar</button>
      <button class="btn-confirm" onclick="saveNewInv()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA
// ============================================================
const CATALOG = [
  {id:1,name:'Mojito Cantina',cat:'Cocteles',price:18000,emoji:'🍹'},
  {id:2,name:'Neon Sour',cat:'Cocteles',price:22000,emoji:'🥂'},
  {id:3,name:'Margarita Verde',cat:'Cocteles',price:20000,emoji:'🍸'},
  {id:4,name:'Aperol Spritz',cat:'Cocteles',price:21000,emoji:'🍊'},
  {id:5,name:'Dark Cantina',cat:'Cocteles',price:24000,emoji:'🌑'},
  {id:6,name:'Michelada Clásica',cat:'Micheladas',price:14000,emoji:'🍺'},
  {id:7,name:'Michelada Picante',cat:'Micheladas',price:16000,emoji:'🌶️'},
  {id:8,name:'Michelada Clamato',cat:'Micheladas',price:18000,emoji:'🍅'},
  {id:9,name:'Michelada Mango',cat:'Micheladas',price:16000,emoji:'🥭'},
  {id:10,name:'Águila Personal',cat:'Cervezas',price:5000,emoji:'🍻'},
  {id:11,name:'Club Colombia',cat:'Cervezas',price:7000,emoji:'🍶'},
  {id:12,name:'Corona 355ml',cat:'Cervezas',price:9000,emoji:'🌊'},
  {id:13,name:'IPA Artesanal',cat:'Cervezas',price:14000,emoji:'🍯'},
];
const MESAS = ['Mesa 1','Mesa 2','Mesa 3','Mesa 4','Mesa 5','Mesa 6','Mesa 7','Mesa 8','Barra 1','Barra 2'];
const CATS = ['Todos',...new Set(CATALOG.map(i=>i.cat))];

// ============================================================
// STATE (localStorage)
// ============================================================
function getState(key,def){try{return JSON.parse(localStorage.getItem('cantina_'+key))||def;}catch{return def;}}
function setState(key,val){localStorage.setItem('cantina_'+key,JSON.stringify(val));}

// orders: [{id,mesa,items:[{id,name,price,qty}],note,status:'pendiente'|'listo',ts}]
// history: [{id,mesa,items,total,pago:{tipo,efectivo,transferencia},ts}]
// inventory: [{id,name,cat,stock,min,unit}]

let currentRole='';
let currentMesa='';
let currentOrder=[];// items in current waiter order
let addMoreCart=[];
let addMoreMesaId=null;
let cobroMesaId=null;
let pagoSelected='';
let activeCat='Todos';
let histFilter='todo';

// ============================================================
// ROLE
// ============================================================
function setRole(role){
  currentRole=role;
  document.getElementById('roleScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  document.getElementById('roleLabel').textContent=role.toUpperCase();
  buildTabs();
  if(role==='mesero'){activateTab('mesero');buildMesero();}
  else if(role==='barman'){activateTab('barman');buildBarman();}
  else{activateTab('mesas');buildMesas();}
  startSync();
}
function goBack(){
  document.getElementById('app').classList.remove('active');
  document.getElementById('roleScreen').style.display='flex';
  if(syncInterval)clearInterval(syncInterval);
}

function buildTabs(){
  const bar=document.getElementById('tabsBar');
  bar.innerHTML='';
  const tabs=currentRole==='mesero'
    ?[{id:'mesero',label:'Pedido'}]
    :currentRole==='barman'
    ?[{id:'barman',label:'Pedidos'}]
    :[{id:'mesas',label:'Mesas'},{id:'historial',label:'Historial'},{id:'reporte',label:'Reporte'},{id:'inventario',label:'Inventario'}];
  tabs.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='tab';btn.dataset.tab=t.id;
    btn.innerHTML=`${t.label}<span class="tab-badge" id="badge_${t.id}" style="display:none">0</span>`;
    btn.onclick=()=>{activateTab(t.id);};
    bar.appendChild(btn);
  });
}
function activateTab(id){
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active',t.dataset.tab===id);
  });
  document.querySelectorAll('.view').forEach(v=>{
    v.classList.remove('active');
  });
  const vmap={mesero:'viewMesero',barman:'viewBarman',mesas:'viewMesas',historial:'viewHistorial',reporte:'viewReporte',inventario:'viewInventario'};
  const el=document.getElementById(vmap[id]);
  if(el)el.classList.add('active');
  if(id==='mesas')buildMesas();
  else if(id==='historial')buildHistorial();
  else if(id==='reporte')buildReporte();
  else if(id==='inventario')buildInventario();
  else if(id==='barman')buildBarman();
}

// ============================================================
// MESERO
// ============================================================
function buildMesero(){
  // Mesa buttons
  const sel=document.getElementById('mesaSelector');
  sel.innerHTML='';
  const orders=getState('orders',[]);
  MESAS.forEach(m=>{
    const btn=document.createElement('button');
    btn.className='mesa-btn';
    const hasOrder=orders.some(o=>o.mesa===m);
    if(hasOrder)btn.classList.add('has-order');
    if(m===currentMesa)btn.classList.add('selected');
    btn.textContent=m;
    btn.onclick=()=>selectMesa(m);
    sel.appendChild(btn);
  });
  // Category filter — restore previously active filter
  const cf=document.getElementById('catFilter');
  cf.innerHTML='';
  CATS.forEach((c)=>{
    const btn=document.createElement('button');
    btn.className='cat-f'+(c===activeCat?' active':'');
    btn.textContent=c;
    btn.onclick=()=>{
      activeCat=c;
      document.querySelectorAll('#catFilter .cat-f').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filterCatalog(c);
    };
    cf.appendChild(btn);
  });
  // Menu grid
  const grid=document.getElementById('menuGrid');
  grid.innerHTML='';
  CATALOG.forEach(item=>{
    const div=document.createElement('div');
    div.className='menu-item';
    div.dataset.cat=item.cat;
    div.innerHTML=`<div class="mi-emoji">${item.emoji}</div>
      <div class="mi-name">${item.name}</div>
      <div class="mi-price">${fmtPrice(item.price)}</div>
      <div class="mi-cat">${item.cat}</div>`;
    div.onclick=()=>addToOrder(item);
    grid.appendChild(div);
  });
  filterCatalog(activeCat);
  renderOrder();
}
function selectMesa(m){
  // Same mesa: don't wipe current order in progress
  if(m===currentMesa){
    document.getElementById('orderTitle').textContent=m;
    renderOrder();
    return;
  }
  currentMesa=m;
  currentOrder=[];
  document.getElementById('orderNote').value='';
  document.querySelectorAll('.mesa-btn').forEach(b=>{
    b.classList.toggle('selected',b.textContent.trim()===m);
  });
  document.getElementById('orderTitle').textContent=m;
  renderOrder();
}
function filterCatalog(cat){
  document.querySelectorAll('.menu-item').forEach(el=>{
    el.classList.toggle('hidden',cat!=='Todos'&&el.dataset.cat!==cat);
  });
}
function addToOrder(item){
  if(!currentMesa){showToast('Selecciona una mesa primero','error');return;}
  const ex=currentOrder.find(i=>i.id===item.id);
  if(ex)ex.qty++;
  else currentOrder.push({...item,qty:1});
  renderOrder();
}
function renderOrder(){
  const el=document.getElementById('orderItems');
  const btn=document.getElementById('btnSend');
  if(!currentOrder.length){
    el.innerHTML='<div class="order-empty">Selecciona una mesa y agrega productos</div>';
    btn.disabled=true;
    document.getElementById('orderTotal').textContent='$0';
    return;
  }
  btn.disabled=!currentMesa;
  el.innerHTML='';
  let total=0;
  currentOrder.forEach((item,idx)=>{
    total+=item.price*item.qty;
    const row=document.createElement('div');row.className='order-item';
    row.innerHTML=`<span class="oi-name">${item.emoji} ${item.name}</span>
      <div class="oi-qty">
        <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
        <span class="oi-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
      </div>
      <span class="oi-price">${fmtPrice(item.price*item.qty)}</span>
      <button class="oi-del" onclick="removeItem(${idx})">×</button>`;
    el.appendChild(row);
  });
  document.getElementById('orderTotal').textContent=fmtPrice(total);
}
function changeQty(idx,delta){
  currentOrder[idx].qty+=delta;
  if(currentOrder[idx].qty<=0)currentOrder.splice(idx,1);
  renderOrder();
}
function removeItem(idx){currentOrder.splice(idx,1);renderOrder();}
function sendOrder(){
  if(!currentMesa||!currentOrder.length)return;
  const orders=getState('orders',[]);
  const id='ord_'+Date.now();
  orders.push({
    id,mesa:currentMesa,
    items:currentOrder.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,emoji:i.emoji})),
    note:document.getElementById('orderNote').value.trim(),
    status:'pendiente',
    ts:Date.now()
  });
  setState('orders',orders);
  showToast(`Pedido enviado — ${currentMesa}`);
  currentOrder=[];
  document.getElementById('orderNote').value='';
  buildMesero();
  selectMesa(currentMesa);
}

// ============================================================
// BARMAN
// ============================================================
function buildBarman(){
  const orders=getState('orders',[]).sort((a,b)=>a.ts-b.ts);
  const body=document.getElementById('barmanBody');
  if(!orders.length){body.innerHTML='<div class="barman-empty">No hay pedidos pendientes 🍹</div>';updateBadge('barman',0);return;}
  updateBadge('barman',orders.filter(o=>o.status==='pendiente').length);
  body.innerHTML='';
  orders.forEach(order=>{
    const div=document.createElement('div');
    div.className='barman-ticket'+(order.status==='pendiente'?' nuevo':'');
    div.innerHTML=`<div class="ticket-head">
      <span class="ticket-mesa">${order.mesa}</span>
      <span class="ticket-time">${fmtTime(order.ts)}</span>
      <span class="ticket-status ${order.status}">${order.status==='pendiente'?'⏳ Pendiente':'✅ Listo'}</span>
    </div>
    <div class="ticket-items">
      ${order.items.map(i=>`<div class="ticket-row"><span><span class="qty">${i.qty}</span>${i.emoji} ${i.name}</span><span style="color:var(--muted)">${fmtPrice(i.price*i.qty)}</span></div>`).join('')}
    </div>
    ${order.note?`<div class="ticket-note">📝 ${order.note}</div>`:''}
    <div class="ticket-actions">
      ${order.status==='pendiente'
        ?`<button class="btn-listo" onclick="markListo('${order.id}')">✅ Marcar Listo</button>`
        :`<span class="btn-ya-listo">✅ Entregado</span>`}
    </div>`;
    body.appendChild(div);
  });
}
function markListo(id){
  const orders=getState('orders',[]);
  const o=orders.find(o=>o.id===id);
  if(o)o.status='listo';
  setState('orders',orders);
  showToast('Pedido marcado como listo');
  buildBarman();
}

// ============================================================
// MESAS (admin/caja)
// ============================================================
function buildMesas(){
  const orders=getState('orders',[]);
  const body=document.getElementById('mesasBody');
  if(!orders.length){body.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted)">No hay mesas activas</div>';return;}
  const byMesa={};
  orders.forEach(o=>{
    if(!byMesa[o.mesa])byMesa[o.mesa]=[];
    byMesa[o.mesa].push(o);
  });
  body.innerHTML='';
  Object.entries(byMesa).forEach(([mesa,ords])=>{
    const allItems={};
    let total=0;
    ords.forEach(o=>{
      o.items.forEach(i=>{
        if(!allItems[i.id])allItems[i.id]={...i,qty:0};
        allItems[i.id].qty+=i.qty;
        total+=i.price*i.qty;
      });
    });
    const allListo=ords.every(o=>o.status==='listo');
    const card=document.createElement('div');card.className='mesa-card';
    card.innerHTML=`<div class="mc-head">
      <span class="mc-title">${mesa}</span>
      <span class="mc-badge ${allListo?'lista':'abierta'}">${allListo?'✅ Listo':'⏳ Activa'}</span>
    </div>
    <div class="mc-items">
      ${Object.values(allItems).map(i=>`<div class="mc-item"><span>${i.emoji} ${i.name} <span class="qn">×${i.qty}</span></span><span class="pr">${fmtPrice(i.price*i.qty)}</span></div>`).join('')}
    </div>
    <div class="mc-total"><span>Total:</span><strong>${fmtPrice(total)}</strong></div>
    <div class="mc-actions">
      <button class="btn-add-more" onclick="openAddMore('${mesa}')">+ Agregar</button>
      <button class="btn-cobrar" onclick="openCobro('${mesa}',${total})">Cobrar</button>
    </div>`;
    body.appendChild(card);
  });
}

// ============================================================
// COBRO
// ============================================================
let cobroTotal=0;
function openCobro(mesa,total){
  cobroMesaId=mesa;cobroTotal=total;pagoSelected='';
  document.getElementById('cobroTitle').textContent='Cobrar — '+mesa;
  document.getElementById('cobroTotal').textContent=fmtPrice(total);
  document.querySelectorAll('.pago-opt').forEach(b=>b.classList.remove('selected'));
  document.getElementById('mixtoFields').classList.remove('show');
  document.getElementById('mixtoEfectivo').value='';
  document.getElementById('mixtoTransferencia').value='';
  document.getElementById('cobroModal').classList.add('open');
}
function selectPago(tipo,btn){
  pagoSelected=tipo;
  document.querySelectorAll('.pago-opt').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('mixtoFields').classList.toggle('show',tipo==='mixto');
}
function updateMixtoRest(){
  const ef=parseFloat(document.getElementById('mixtoEfectivo').value)||0;
  const rest=Math.max(0,cobroTotal-ef);
  document.getElementById('mixtoTransferencia').value=rest;
}
function confirmarCobro(){
  if(!pagoSelected){showToast('Selecciona método de pago','error');return;}
  let pagoInfo={tipo:pagoSelected};
  if(pagoSelected==='mixto'){
    const ef=parseFloat(document.getElementById('mixtoEfectivo').value)||0;
    const tr=cobroTotal-ef;
    if(ef<=0||tr<0){showToast('Revisa los montos mixtos','error');return;}
    pagoInfo.efectivo=ef;pagoInfo.transferencia=tr;
  }
  // Save to history
  const orders=getState('orders',[]);
  const mesaOrders=orders.filter(o=>o.mesa===cobroMesaId);
  const allItems={};
  let total=0;
  mesaOrders.forEach(o=>{
    o.items.forEach(i=>{
      if(!allItems[i.id])allItems[i.id]={...i,qty:0};
      allItems[i.id].qty+=i.qty;
      total+=i.price*i.qty;
    });
  });
  const hist=getState('history',[]);
  hist.push({
    id:'h_'+Date.now(),
    mesa:cobroMesaId,
    items:Object.values(allItems),
    total,
    pago:pagoInfo,
    ts:Date.now()
  });
  setState('history',hist);
  // Remove from active orders
  setState('orders',orders.filter(o=>o.mesa!==cobroMesaId));
  closeModal('cobroModal');
  showToast(`Mesa cobrada — ${fmtPrice(total)}`);
  buildMesas();
}

// ============================================================
// ADD MORE TO MESA
// ============================================================
function openAddMore(mesa){
  addMoreMesaId=mesa;addMoreCart=[];
  document.getElementById('addMoreTitle').textContent='Agregar a '+mesa;
  const cf=document.getElementById('addMoreCatFilter');
  cf.innerHTML='';
  CATS.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='cat-f'+(i===0?' active':'');btn.textContent=c;
    btn.onclick=()=>{
      document.querySelectorAll('#addMoreCatFilter .cat-f').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('#addMoreGrid .menu-item').forEach(el=>{
        el.classList.toggle('hidden',c!=='Todos'&&el.dataset.cat!==c);
      });
    };
    cf.appendChild(btn);
  });
  const grid=document.getElementById('addMoreGrid');
  grid.innerHTML='';
  CATALOG.forEach(item=>{
    const div=document.createElement('div');div.className='menu-item';div.dataset.cat=item.cat;
    div.innerHTML=`<div class="mi-emoji">${item.emoji}</div><div class="mi-name">${item.name}</div><div class="mi-price">${fmtPrice(item.price)}</div>`;
    div.onclick=()=>{
      const ex=addMoreCart.find(i=>i.id===item.id);
      if(ex)ex.qty++;else addMoreCart.push({...item,qty:1});
      renderAddMoreCart();
    };
    grid.appendChild(div);
  });
  renderAddMoreCart();
  document.getElementById('addMoreModal').classList.add('open');
}
function renderAddMoreCart(){
  const el=document.getElementById('addMoreCart');
  if(!addMoreCart.length){el.innerHTML='';return;}
  el.innerHTML=addMoreCart.map((i,idx)=>`
    <div class="order-item">
      <span class="oi-name">${i.emoji} ${i.name}</span>
      <div class="oi-qty">
        <button class="qty-btn" onclick="amQty(${idx},-1)">−</button>
        <span class="oi-num">${i.qty}</span>
        <button class="qty-btn" onclick="amQty(${idx},1)">+</button>
      </div>
      <span class="oi-price">${fmtPrice(i.price*i.qty)}</span>
    </div>`).join('');
}
function amQty(idx,d){
  addMoreCart[idx].qty+=d;
  if(addMoreCart[idx].qty<=0)addMoreCart.splice(idx,1);
  renderAddMoreCart();
}
function confirmAddMore(){
  if(!addMoreCart.length){showToast('Agrega productos primero','error');return;}
  const orders=getState('orders',[]);
  orders.push({
    id:'ord_'+Date.now(),mesa:addMoreMesaId,
    items:addMoreCart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,emoji:i.emoji})),
    note:'Adición',status:'pendiente',ts:Date.now()
  });
  setState('orders',orders);
  closeModal('addMoreModal');
  showToast('Productos agregados al pedido');
  buildMesas();
}

// ============================================================
// HISTORIAL
// ============================================================
function buildHistorial(){
  const hist=getState('history',[]).slice().reverse();
  const body=document.getElementById('histBody');
  const filtered=histFilter==='todo'?hist:hist.filter(h=>h.pago.tipo===histFilter);
  if(!filtered.length){body.innerHTML='<div class="hist-empty">Sin registros en el historial</div>';return;}
  body.innerHTML='';
  filtered.forEach(h=>{
    const div=document.createElement('div');div.className='hist-item';
    const pagoLabel=h.pago.tipo==='mixto'
      ?`Mixto: ${fmtPrice(h.pago.efectivo)} ef + ${fmtPrice(h.pago.transferencia)} tr`
      :h.pago.tipo;
    div.innerHTML=`<div class="hi-head">
      <span class="hi-mesa">${h.mesa}</span>
      <span class="hi-time">${fmtDate(h.ts)}</span>
      <span class="hi-pago ${h.pago.tipo}">${pagoLabel}</span>
    </div>
    <div class="hi-items">${h.items.map(i=>`${i.emoji} ${i.name} ×${i.qty}`).join(' · ')}</div>
    <div class="hi-total">${fmtPrice(h.total)}</div>`;
    body.appendChild(div);
  });
}
function filterHist(f,btn){
  histFilter=f;
  document.querySelectorAll('.hist-filter .cat-f').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildHistorial();
}

// ============================================================
// REPORTE
// ============================================================
function buildReporte(){
  const hist=getState('history',[]);
  const today=new Date();today.setHours(0,0,0,0);
  const todayHist=hist.filter(h=>h.ts>=today.getTime());
  const totalVentas=todayHist.reduce((a,h)=>a+h.total,0);
  const totalEf=todayHist.filter(h=>h.pago.tipo==='efectivo').reduce((a,h)=>a+h.total,0)
    +todayHist.filter(h=>h.pago.tipo==='mixto').reduce((a,h)=>a+(h.pago.efectivo||0),0);
  const totalTr=todayHist.filter(h=>h.pago.tipo==='transferencia').reduce((a,h)=>a+h.total,0)
    +todayHist.filter(h=>h.pago.tipo==='mixto').reduce((a,h)=>a+(h.pago.transferencia||0),0);
  // Top products today
  const prodMap={};
  todayHist.forEach(h=>h.items.forEach(i=>{
    if(!prodMap[i.id])prodMap[i.id]={name:i.name,emoji:i.emoji,qty:0,total:0};
    prodMap[i.id].qty+=i.qty;prodMap[i.id].total+=i.price*i.qty;
  }));
  const topProds=Object.values(prodMap).sort((a,b)=>b.qty-a.qty);
  const body=document.getElementById('repBody');
  body.innerHTML=`
    <div class="rep-section">
      <h4>Resumen del Día</h4>
      <div class="rep-cards">
        <div class="rep-card"><div class="rc-label">Total Ventas</div><div class="rc-val">${fmtPrice(totalVentas)}</div><div class="rc-sub">${todayHist.length} mesas</div></div>
        <div class="rep-card"><div class="rc-label">Efectivo</div><div class="rc-val">${fmtPrice(totalEf)}</div></div>
        <div class="rep-card"><div class="rc-label">Transferencia</div><div class="rc-val">${fmtPrice(totalTr)}</div></div>
        <div class="rep-card"><div class="rc-label">Mesas Cobradas</div><div class="rc-val">${todayHist.length}</div></div>
      </div>
    </div>
    ${topProds.length?`<div class="rep-section">
      <h4>Productos Más Vendidos (Hoy)</h4>
      <div class="inv-table-wrap">
        <table class="rep-table">
          <thead><tr><th>Producto</th><th>Cant.</th><th>Total</th></tr></thead>
          <tbody>${topProds.map(p=>`<tr><td>${p.emoji} ${p.name}</td><td class="val">${p.qty}</td><td class="val">${fmtPrice(p.total)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`:''}
    ${hist.length?`<div class="rep-section">
      <h4>Histórico General</h4>
      <div class="rep-cards">
        <div class="rep-card"><div class="rc-label">Total Histórico</div><div class="rc-val">${fmtPrice(hist.reduce((a,h)=>a+h.total,0))}</div></div>
        <div class="rep-card"><div class="rc-label">Total Mesas</div><div class="rc-val">${hist.length}</div></div>
      </div>
    </div>`:''}
    <div class="rep-actions">
      <button class="btn-export" onclick="exportReport()">⬇ Exportar Reporte</button>
      <button class="btn-cierre" onclick="cierreDia()">⚠ Cierre del Día</button>
    </div>
  `;
}
function exportReport(){
  const hist=getState('history',[]);
  let csv='Mesa,Fecha,Items,Total,Pago\n';
  hist.forEach(h=>{
    const items=h.items.map(i=>`${i.name}x${i.qty}`).join(' | ');
    const pago=h.pago.tipo==='mixto'?`Mixto ef:${h.pago.efectivo} tr:${h.pago.transferencia}`:h.pago.tipo;
    csv+=`"${h.mesa}","${fmtDate(h.ts)}","${items}",${h.total},"${pago}"\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`cantina_reporte_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('Reporte exportado como CSV');
}
function cierreDia(){
  if(!confirm('¿Cerrar el día? Esto limpiará el historial del día (se habrá exportado). Los datos se guardan permanentemente.'))return;
  showToast('Cierre registrado. Exporta primero si no lo has hecho.');
}

// INVENTARIO
// ============================================================

    {id:2,name:'Tequila',cat:'Licores',stock:2,min:2,unit:'botellas'},
    {id:3,name:'Pisco',cat:'Licores',stock:1,min:1,unit:'botellas'},
    {id:4,name:'Mezcal',cat:'Licores',stock:3,min:1,unit:'botellas'},
    {id:5,name:'Aperol',cat:'Licores',stock:2,min:1,unit:'botellas'},
    {id:6,name:'Águila Personal',cat:'Cervezas',stock:48,min:24,unit:'unidades'},
    {id:7,name:'Club Colombia',cat:'Cervezas',stock:24,min:12,unit:'unidades'},
    {id:8,name:'Corona',cat:'Cervezas',stock:18,min:12,unit:'unidades'},
    {id:9,name:'Menta fresca',cat:'Insumos',stock:5,min:2,unit:'manojos'},

    {id:12,name:'Chamoy',cat:'Insumos',stock:4,min:2,unit:'frascos'},
  ];
  return getState('inventory',def);
}
function buildInventario(){
  const inv=getInventory();
  const body=document.getElementById('invBody');
  body.innerHTML=`<div class="inv-table-wrap">
    <table class="inv-table">
      <thead><tr><th>Ítem</th><th>Categoría</th><th>Stock</th><th>Mín.</th><th>Unidad</th><th>Estado</th><th>Ajustar</th></tr></thead>
      <tbody>
        ${inv.map(i=>{
          const st=i.stock===0?'stock-out':i.stock<=i.min?'stock-low':'stock-ok';
          const label=i.stock===0?'⛔ Agotado':i.stock<=i.min?'⚠ Bajo':'✅ OK';
          return `<tr>
            <td>${i.name}</td><td style="color:var(--muted)">${i.cat}</td>
            <td class="${st}" style="font-weight:600">${i.stock}</td>
            <td style="color:var(--muted)">${i.min}</td>
            <td style="color:var(--muted)">${i.unit}</td>
            <td class="${st}">${label}</td>
            <td style="display:flex;gap:4px;align-items:center">
              <input type="number" class="inv-input" value="${i.stock}" id="inv_${i.id}" min="0">
              <button class="btn-inv-save" onclick="saveInvItem(${i.id})">✓</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function saveInvItem(id){
  const inv=getInventory();
  const item=inv.find(i=>i.id===id);
  if(!item)return;
  const val=parseInt(document.getElementById('inv_'+id).value)||0;
  item.stock=val;
  setState('inventory',inv);
  showToast('Stock actualizado');
  buildInventario();
}
function openAddInv(){document.getElementById('addInvModal').classList.add('open');}
function saveNewInv(){
  const name=document.getElementById('invNewName').value.trim();
  if(!name){showToast('Ingresa un nombre','error');return;}
  const inv=getInventory();
  inv.push({
    id:Date.now(),
    name,
    cat:document.getElementById('invNewCat').value,
    stock:parseInt(document.getElementById('invNewStock').value)||0,
    min:parseInt(document.getElementById('invNewMin').value)||0,
    unit:document.getElementById('invNewUnit').value||'unidades'
  });
  setState('inventory',inv);
  closeModal('addInvModal');
  showToast('Ítem agregado al inventario');
  buildInventario();
}

// ============================================================
// SYNC (polling)
// ============================================================
let syncInterval=null;
let lastOrderCount=-1;
function startSync(){
  syncInterval=setInterval(()=>{
    const orders=getState('orders',[]);
    const pending=orders.filter(o=>o.status==='pendiente').length;
    if(currentRole==='barman'){
      if(orders.length!==lastOrderCount){lastOrderCount=orders.length;buildBarman();}
      updateBadge('barman',pending);
    }
    if(currentRole==='admin'){
      updateBadge('mesas',orders.length);
    }
    if(currentRole==='mesero'){
      // Only refresh mesa indicator badges — never reset order or filter
      syncMesaBadges();
    }
    // Clock for barman
    const cl=document.getElementById('barmanClock');
    if(cl)cl.textContent=new Date().toLocaleTimeString('es-CO');
  },2000);
}
// Refresh only the has-order indicators on mesa buttons without touching order state or cat filter
function syncMesaBadges(){
  const orders=getState('orders',[]);
  document.querySelectorAll('.mesa-btn').forEach(btn=>{
    const mesa=btn.textContent.trim();
    const hasOrder=orders.some(o=>o.mesa===mesa);
    btn.classList.toggle('has-order',hasOrder&&btn.textContent!==currentMesa);
    if(mesa===currentMesa){
      btn.classList.add('selected');
      btn.classList.toggle('has-order',false);
    }
  });
}
function updateBadge(tab,count){
  const el=document.getElementById('badge_'+tab);
  if(!el)return;
  el.style.display=count>0?'inline-block':'none';
  el.textContent=count;
}

// ============================================================
// HELPERS
// ============================================================
function fmtPrice(n){return '$'+Math.round(n).toLocaleString('es-CO');}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(ts){return new Date(ts).toLocaleString('es-CO',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function closeModal(id){document.getElementById(id).classList.remove('open');}
let toastTimeout=null;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  if(toastTimeout)clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>t.classList.remove('show'),2500);
}
// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
</script>
